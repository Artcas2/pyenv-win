name: Update cached versions

on:
  schedule:
    - cron: '0 0 * * 4'
  workflow_dispatch:

jobs:
  update_cache:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5.0.0

      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13.*"

      - name: Update versions cache
        run: python ./.github/scripts/update_versions_cache.py

      - name: Commit updated version file
        run: |
          git config user.name "Artcas2"
          git config user.email "63158439+Artcas2@users.noreply.github.com"
          git add ./pyenv-win/.versions_cache.xml
          git commit -m "Update cached versions" || echo "No changes to commit"
          git push
